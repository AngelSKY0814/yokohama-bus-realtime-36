// GPS間の距離をメートルで計算
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// バスが境界の停留所に到達したか判定
function isAtHideStop(bus) {
  const distance = getDistance(
    Number(bus.latitude),
    Number(bus.longitude),
    hideStop.latitude,
    hideStop.longitude
  );

  return distance <= 40;
}

/* ---------------------------------------
GPS距離計算
---------------------------------------- */

function toXY(lat,lon,baseLat){
  const rlat=Number(lat)*Math.PI/180;
  return {
    x:Number(lon)*111320*Math.cos(Number(baseLat)*Math.PI/180),
    y:Number(lat)*111320
  };
}

function segmentInfo(a,b,lat,lon){
  const base=(Number(a.latitude)+Number(b.latitude))/2;
  const p=toXY(a.latitude,a.longitude,base);
  const q=toXY(b.latitude,b.longitude,base);
  const x=toXY(lat,lon,base);

  const dx=q.x-p.x, dy=q.y-p.y;
  const len2=dx*dx+dy*dy;

  let t=0;
  if(len2>0){
    t=((x.x-p.x)*dx+(x.y-p.y)*dy)/len2;
  }

  t=Math.max(0,Math.min(1,t));

  const nx=p.x+dx*t, ny=p.y+dy*t;
  const error=Math.hypot(x.x-nx,x.y-ny);
  const length=Math.sqrt(len2);

  return {t,error,length};
}

function distance(a,b){
  const base=(Number(a.latitude)+Number(b.latitude))/2;
  const p=toXY(a.latitude,a.longitude,base);
  const q=toXY(b.latitude,b.longitude,base);
  return Math.hypot(q.x-p.x,q.y-p.y);
}

/* ---------------------------------------
   その路線の停留所を画面topへ対応させる

   共通停留所は既存の画面位置を使用。
   路線固有停留所は、その路線上の距離比から補間。
---------------------------------------- */
function buildScreenRoute(route){
  const stops=route.stops;
  if(!Array.isArray(stops)||stops.length<2) return null;

  const cum=[0];
  for(let i=0;i<stops.length-1;i++){
    cum.push(cum[i]+distance(stops[i],stops[i+1]));
  }

  const anchors=[];
  for(let i=0;i<stops.length;i++){
    const top=displayTop[stops[i].name];
    if(top!==undefined){
      anchors.push({index:i,distance:cum[i],top,name:stops[i].name});
    }
  }

  if(anchors.length<2) return null;

  const tops=new Array(stops.length);

  /* 共通停留所 */
  for(const a of anchors) tops[a.index]=a.top;

  /* 最初の表示停留所より前 */
  for(let i=anchors[0].index-1;i>=0;i--){
    tops[i]=tops[i+1]-200;
  }

  /* 表示停留所間 */
  for(let k=0;k<anchors.length-1;k++){
    const a=anchors[k],b=anchors[k+1];
    const span=b.distance-a.distance;

    for(let i=a.index+1;i<b.index;i++){
      const t=span>0?(cum[i]-a.distance)/span:0;
      tops[i]=a.top+(b.top-a.top)*t;
    }
  }

  /* 最後の表示停留所より後 */
  const last=anchors[anchors.length-1];
  for(let i=last.index+1;i<stops.length;i++){
    tops[i]=tops[i-1]-200;
  }

  return stops.map((stop,i)=>({
    ...stop,
    index:i,
    cumulativeDistance:cum[i],
    top:tops[i]
  }));
}
/* ---------------------------------------
   西菅田団地～ケアプラザ入口の区間を探す
---------------------------------------- */
function findCommonSection(stops){

  const candidates=[];

  const landmarks=[
    "ひまわり団地前",
    "小川橋",
    "道路碑前",
    "熊の堂",
    "菅田町入口"
  ];

  for(let i=0;i<stops.length;i++){

    if(stops[i].name!=="西菅田団地") continue;

    for(let j=0;j<stops.length;j++){

      if(stops[j].name!=="ケアプラザ入口") continue;
      if(i===j) continue;

      const start=Math.min(i,j);
      const end=Math.max(i,j);

      const length=
        stops[end].cumulativeDistance-
        stops[start].cumulativeDistance;

      if(length<500 || length>8000) continue;

      const sectionStops=stops.slice(start,end+1);

      const landmarkCount=sectionStops.filter(stop=>
        landmarks.includes(stop.name)
      ).length;

      if(landmarkCount<2) continue;

      candidates.push({
        start,
        end,
        length
      });
    }
  }

  if(candidates.length===0) return null;

  candidates.sort((a,b)=>a.length-b.length);

  return candidates[0];
}
  
/* ---------------------------------------
   バスGPSを路線の線分上へ投影
---------------------------------------- */
function projectBus(bus,route){
  const rs=buildScreenRoute(route);
  if(!rs) return null;

  let best=null;

  for(let i=0;i<rs.length-1;i++){
    const a=rs[i],b=rs[i+1];
    const info=segmentInfo(
      a,b,
      Number(bus.latitude),
      Number(bus.longitude)
    );

    const routeDistance=
      a.cumulativeDistance+
      info.length*info.t;

    if(!best||info.error<best.error){
      best={
        error:info.error,
        ratio:info.t,
        segmentIndex:i,
        routeDistance,
        stops:rs
      };
    }
  }

  return best;
}

/* ---------------------------------------
   路線上の距離から画面topを求める
---------------------------------------- */
function routeDistanceToTop(projected){
  if(!projected) return null;

  const rs=projected.stops;
  const i=projected.segmentIndex;

  const a=rs[i],b=rs[i+1];
  const raw=a.top+(b.top-a.top)*projected.ratio;

  const margin=45;
  const low=Math.min(a.top,b.top)+margin;
  const high=Math.max(a.top,b.top)-margin;

  if(high<low) return (a.top+b.top)/2;

  return Math.max(low,Math.min(high,raw));
}

function getAccurateBusTop(bus){
  const route=routeStopsData[String(bus.courseId)];
  if(!route) return null;

  const projected=projectBus(bus,route);
  if(!projected) return null;

  /*
    GPSが路線から大きく外れている場合でも
    完全に消さず、最近区間に表示する。
    これで実際のバスを突然消すことを防ぐ。
  */
  return routeDistanceToTop(projected);
}

/* ---------------------------------------
   バス作成・更新
---------------------------------------- */
function createBus(bus){
  const div=document.createElement("div");
  div.className="bus bus-right";
  div.id="bus-"+String(bus.id);

  div.innerHTML=
    "<div class='bus-id'>🚌 "+String(bus.id)+"</div>"+
    "<div class='bus-route'></div>"+
    "<div class='bus-destination'></div>";

  // 展開中のバスを押すと、まとめた状態に戻す
  div.addEventListener("click",()=>{
    const key=div.dataset.clusterKey;
    if(key && expandedBusGroups.has(key)){
      expandedBusGroups.delete(key);
      updateBusClusters();
    }
    openBusDetail(bus);
  });

  document.body.appendChild(div);
  busElements[String(bus.id)]=div;
  return div;
}

function updateBusPosition(bus){
  const id=String(bus.id);
  let element=busElements[id];

  if(!element) element=createBus(bus);

  const top=getAccurateBusTop(bus);
  const route=routeStopsData[String(bus.courseId)];
  const projected=route?projectBus(bus,route):null;
  if(projected){
    const previous=busGpsHistory[id];
    busGpsHistory[id]={
      distance:projected.routeDistance,time:Date.now(),
      previousDistance:previous?previous.distance:undefined,
      previousTime:previous?previous.time:undefined
    };
  }

  if(top===null){
    element.style.display="none";
    delete busPositionData[id];
    return;
  }

  let side;
  if(String(bus.direction)==="up"){
    element.classList.remove("bus-right");
    element.classList.add("bus-left");
    side="left";
  }else{
    element.classList.remove("bus-left");
    element.classList.add("bus-right");
    side="right";
  }

  // GPSから計算した通常の表示位置を保存
  busPositionData[id]={top:top,side:side};
  element.style.display="block";
  element.style.top=top+"px";

  element.querySelector(".bus-route").textContent=bus.route||"";
  element.querySelector(".bus-destination").textContent=bus.destination||"";
}

/* ---------------------------------------
   重なったバスをまとめて表示する
   同じ側で画面上の位置が60px以内なら同じグループ
---------------------------------------- */
function updateBusClusters(){
  const entries=Object.entries(busPositionData).map(([id,data])=>({
    id:id,
    top:data.top,
    side:data.side
  }));

  const groups=[];

  for(const side of ["left","right"]){
    const list=entries
      .filter(item=>item.side===side)
      .sort((a,b)=>a.top-b.top);

    let group=[];

    for(const item of list){
      if(group.length===0 || item.top-group[0].top<=60){
        group.push(item);
      }else{
        if(group.length>=2) groups.push(group);
        group=[item];
      }
    }

    if(group.length>=2) groups.push(group);
  }

  const activeKeys=new Set();
  const groupedIds=new Set();

  for(const group of groups){
    const ids=group.map(item=>item.id).sort();
    const key=group[0].side+":"+ids.join("_");
    activeKeys.add(key);

    group.forEach(item=>groupedIds.add(item.id));

    const averageTop=group.reduce((sum,item)=>sum+item.top,0)/group.length;
    const firstElement=busElements[group[0].id];
    if(!firstElement) continue;

    if(!busClusterElements[key]){
      const button=document.createElement("button");
      button.className="bus-cluster";
      button.type="button";
      button.setAttribute("aria-label",group.length+"台のバスを表示");

      button.addEventListener("click",()=>{
        if(expandedBusGroups.has(key)){
          expandedBusGroups.delete(key);
        }else{
          expandedBusGroups.add(key);
        }
        updateBusClusters();
      });

      document.body.appendChild(button);
      busClusterElements[key]=button;
    }

    const cluster=busClusterElements[key];
    cluster.textContent=group.length+"台";
    cluster.style.top=averageTop+"px";
    cluster.style.left=(firstElement.offsetLeft+(firstElement.offsetWidth-64)/2)+"px";

    if(expandedBusGroups.has(key)){
      cluster.style.display="none";

      group.forEach((item,index)=>{
        const element=busElements[item.id];
        if(!element) return;

        const offset=(index-(group.length-1)/2)*68;
        element.style.display="block";
        element.style.top=(averageTop+offset)+"px";
        element.dataset.clusterKey=key;
      });
    }else{
      cluster.style.display="block";

      group.forEach(item=>{
        const element=busElements[item.id];
        if(!element) return;

        element.style.display="none";
        element.dataset.clusterKey=key;
      });
    }
  }

  // グループに入っていないバスは通常の位置に表示
  for(const item of entries){
    if(!groupedIds.has(item.id)){
      const element=busElements[item.id];
      if(!element) continue;

      element.style.display="block";
      element.style.top=item.top+"px";
      delete element.dataset.clusterKey;
    }
  }

  // 今回の更新で不要になったまとめボタンを削除
  for(const key of Object.keys(busClusterElements)){
    if(!activeKeys.has(key)){
      busClusterElements[key].remove();
      delete busClusterElements[key];
      expandedBusGroups.delete(key);
    }
  }
}

// 時刻表JSONを読み込む
async function loadTimetable(){
  try{
    const response=await fetch("timetable.json?"+Date.now(),{cache:"no-store"});
    if(!response.ok) throw new Error("timetable.json が見つかりません");
    const data=await response.json();
    if(!Array.isArray(data.trips)) throw new Error("timetable.json の形式が正しくありません");
    timetableData=data;
    document.getElementById("routeStatus").textContent="路線情報・時刻表を読み込みました。";
  }catch(error){
    timetableData=null;
    console.warn("時刻表データ:",error.message);
    document.getElementById("routeStatus").textContent="路線情報は読み込みました。timetable.json は未設置です。";
  }
}
function timeToMinutes(value){
  if(!value || !/^\d{1,2}:\d{2}$/.test(String(value))) return null;
  const parts=String(value).split(":").map(Number);
  return parts[0]*60+parts[1];
}
function formatClock(date){
  return date.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
function formatMinuteDifference(value){
  if(value===null || !Number.isFinite(value)) return "計算中";
  if(value>0) return "約"+value+"分遅れ";
  if(value<0) return "約"+Math.abs(value)+"分早着";
  return "ほぼ定刻";
}
function findMatchingTrip(courseId,nextStopName,targetDate){
  if(!timetableData || !Array.isArray(timetableData.trips)) return null;
  const targetMinutes=targetDate.getHours()*60+targetDate.getMinutes();
  const candidates=timetableData.trips.filter(trip=>
    String(trip.courseId)===String(courseId) &&
    trip.dayType===timetableDayType &&
    Array.isArray(trip.stops)
  );
  let best=null;
  for(const trip of candidates){
    const row=trip.stops.find(stop=>stop.name===nextStopName);
    if(!row) continue;
    const scheduled=timeToMinutes(row.time);
    if(scheduled===null) continue;
    let diff=Math.abs(scheduled-targetMinutes);
    diff=Math.min(diff,Math.abs(diff-1440));
    if(!best || diff<best.diff) best={trip,diff};
  }
  return best && best.diff<=90 ? best.trip : null;
}
function openBusDetail(bus){
  selectedBusForDetail=bus;
  renderBusDetail();
}
function renderBusDetail(){
  const bus=selectedBusForDetail;
  if(!bus) return;
  const route=routeStopsData[String(bus.courseId)];
  const projected=route?projectBus(bus,route):null;
  const content=document.getElementById("busDetailContent");
  const backdrop=document.getElementById("busDetailBackdrop");
  if(!route||!projected){
    content.textContent="このバスの停留所情報を取得できません。";
    backdrop.classList.add("open"); return;
  }
  const stops=projected.stops;
  const firstIndex=Math.min(projected.segmentIndex+1,stops.length-1);
  const history=busGpsHistory[String(bus.id)];
  let speed=0;
  if(history && history.previousDistance!==undefined){
    const seconds=(history.time-history.previousTime)/1000;
    if(seconds>0) speed=(history.distance-history.previousDistance)/seconds;
  }
  if(speed>16) speed=0;
  const now=new Date();
  const firstRemaining=Math.max(0,stops[firstIndex].cumulativeDistance-projected.routeDistance);
  const firstEtaMinutes=speed>0.8?Math.max(1,Math.ceil(firstRemaining/(speed*60))):null;
  const firstEtaDate=firstEtaMinutes===null?null:new Date(now.getTime()+firstEtaMinutes*60000);
  const trip=findMatchingTrip(bus.courseId,stops[firstIndex].name,firstEtaDate||now);
  const direction=String(bus.direction)==="up"?"上り方向":"下り方向";
  let delayText="時刻表データなし";
  let rows="";
  if(trip){
    const scheduledNext=trip.stops.find(stop=>stop.name===stops[firstIndex].name);
    const scheduledMinutes=timeToMinutes(scheduledNext.time);
    let predictedMinutes=firstEtaDate?firstEtaDate.getHours()*60+firstEtaDate.getMinutes():null;
    let delay=null;
    if(predictedMinutes!==null && scheduledMinutes!==null){
      delay=predictedMinutes-scheduledMinutes;
      if(delay>720) delay-=1440;
      if(delay< -720) delay+=1440;
    }
    delayText=formatMinuteDifference(delay);
    rows=stops.slice(firstIndex).map(stop=>{
      const scheduled=trip.stops.find(item=>item.name===stop.name);
      const remaining=Math.max(0,stop.cumulativeDistance-projected.routeDistance);
      const etaMinutes=speed>0.8?Math.max(0,Math.ceil(remaining/(speed*60))):null;
      const etaTime=etaMinutes===null?"計算中":formatClock(new Date(now.getTime()+etaMinutes*60000));
      return `<tr><td>${escapeHtml(stop.name)}</td><td>${scheduled?escapeHtml(scheduled.time):"—"}</td><td>${etaTime}</td></tr>`;
    }).join("");
  }else{
    rows=stops.slice(firstIndex).map(stop=>
      `<tr><td>${escapeHtml(stop.name)}</td><td>—</td><td>計算中</td></tr>`
    ).join("");
  }
  const dayLabel={weekday:"平日",saturday:"土曜",holiday:"日曜・祝日"}[timetableDayType];
  const timetableStatus=trip
    ?"時刻表データを使用中（"+dayLabel+"）"
    :"時刻表データが未設置、またはこの便に一致するデータがありません。";
  content.innerHTML=`
    <div><b>${escapeHtml(bus.route||"36系統")}</b> ${escapeHtml(bus.destination||"")}</div>
    <div class="bus-detail-grid">
      <div class="bus-detail-card"><div class="bus-detail-label">車両番号</div><div class="bus-detail-value">${escapeHtml(String(bus.id))}</div></div>
      <div class="bus-detail-card"><div class="bus-detail-label">進行方向</div><div class="bus-detail-value">${direction}</div></div>
      <div class="bus-detail-card"><div class="bus-detail-label">次のバス停</div><div class="bus-detail-value">${escapeHtml(stops[firstIndex].name)}</div></div>
      <div class="bus-detail-card"><div class="bus-detail-label">到着予測（GPS）</div><div class="bus-detail-value">${firstEtaDate?formatClock(firstEtaDate):"GPS速度を計算中"}</div></div>
    </div>
    <div class="bus-detail-card"><div class="bus-detail-label">遅延・早着</div><div class="bus-detail-delay">${escapeHtml(delayText)}</div></div>
    <div class="bus-detail-note">時刻表区分：${dayLabel}（現在の日付から自動判定）</div>
    <table class="bus-detail-table"><thead><tr><th>停留所</th><th>時刻表</th><th>到着予測</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="bus-detail-note">${escapeHtml(timetableStatus)}<br>停留所は次の停留所から終点まで表示します。到着予測は直近のGPS位置の変化から算出する概算です。速度が取得できない場合は「計算中」と表示します。信号待ち・渋滞などにより実際の到着時刻と異なる場合があります。</p>`;
  backdrop.classList.add("open");
}
function closeBusDetail(){document.getElementById("busDetailBackdrop").classList.remove("open");}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function removeOldBuses(buses){
  const ids=new Set(buses.map(b=>String(b.id)));

  for(const id in busElements){
    if(!ids.has(id)){
      busElements[id].remove();
      delete busElements[id];
      delete busPositionData[id];
      delete busGpsHistory[id];
    }
  }
}

/* ---------------------------------------
   bus_position.json
---------------------------------------- */
async function updateBus(){
  if(busUpdateRunning) return;
  busUpdateRunning=true;
  try{
   const response=await fetch(
  "https://late-morning-6465.angelsky-sora-mm-0814.workers.dev/",
  {cache:"no-store"}
);
const data=await response.json();
const allBuses=Array.isArray(data.buses)?data.buses:[];

// 36系統と82系統のバスを表示対象にする
const buses = allBuses.filter(bus => {
    const route = String(bus.route || "");

    return route.includes("36系統") ||
           route.includes("82系統") ||
      　   route.includes("295系統") ||
           route.includes("326系統");
});

document.getElementById("busCount").textContent=buses.length;
document.getElementById("updateTime").textContent=
    data.updated||new Date().toLocaleTimeString("ja-JP");

const filterFallback = false;

if(filterFallback){
      document.getElementById("routeStatus").textContent="Workerから36系統の表記を確認できません。全車両を一時表示しています。";
    }else if(!routeStopsData || Object.keys(routeStopsData).length===0){
      document.getElementById("routeStatus").textContent="バス情報は取得しましたが、停留所情報を再読み込み中です。";
    }else{
      document.getElementById("routeStatus").textContent="バス情報を自動更新中です。";
    }

    removeOldBuses(buses);

    for(const bus of buses){
      updateBusPosition(bus);
    }

    // 重なったバスをまとめる／展開状態を反映
    updateBusClusters();

    const list=document.getElementById("busList");
    list.innerHTML="";

    if(buses.length===0){
      list.textContent="現在運行中のバスはありません。";
      return;
    }

    for(const bus of buses){
      const item=document.createElement("div");
      item.className="bus-item";

      const side=
        String(bus.direction)==="up"
          ? "左側 ↑"
          : "右側 ↓";

      item.innerHTML=
        "<strong>"+String(bus.id)+"</strong> "+side+
        "<br>"+(bus.route||"")+
        "<br>"+(bus.destination||"")+
        "<br>緯度: "+bus.latitude+
        "<br>経度: "+bus.longitude;

      list.appendChild(item);
    }

    // 詳細画面を開いている場合は、最新GPSで到着予測を更新する
    if(selectedBusForDetail && document.getElementById("busDetailBackdrop").classList.contains("open")){
      const latest=buses.find(bus=>String(bus.id)===String(selectedBusForDetail.id));
      if(latest){ selectedBusForDetail=latest; renderBusDetail(); }
    }

  }catch(error){
    console.error(error);

    document.getElementById("busCount").textContent="取得失敗";
    document.getElementById("updateTime").textContent="--:--:--";
    document.getElementById("routeStatus").textContent="バス情報の取得に失敗しました。5秒後に自動で再試行します。";
    document.getElementById("busList").textContent=error.message;
  }finally{
    busUpdateRunning=false;
  }
}

/* ---------------------------------------
   起動：停留所データの失敗でバス取得まで止めない
---------------------------------------- */
async function retryLoadRouteStops(){
  if(routeStopsRetryRunning) return;
  routeStopsRetryRunning=true;
  try{
    await loadRouteStops();
  }catch(error){
    console.warn("route_stops.json:",error.message);
    document.getElementById("routeStatus").textContent="停留所情報を取得できません。GitHub Pages上のroute_stops.jsonを確認してください。";
  }finally{
    routeStopsRetryRunning=false;
  }
}

async function start(){
  // 先に定期更新を開始し、初回のファイル読込エラーで停止しないようにする
  if(!busUpdateTimer) busUpdateTimer=setInterval(updateBus,5000);
  await retryLoadRouteStops();
  await loadTimetable();
  await updateBus();
  // 停留所JSONの一時的な取得失敗にも対応して30秒ごとに再試行
  setInterval(retryLoadRouteStops,30000);
}

start();
